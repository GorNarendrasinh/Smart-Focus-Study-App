<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Focus App</title>

<style>
:root{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#fff;
}

body.light{
  --bg:#f5f5f5;
  --card:#fff;
  --text:#111;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
}

.logo{font-weight:bold;font-size:20px;}

.nav-links{
  display:flex;
  gap:15px;
}

.nav-links a{
  color:white;
  text-decoration:none;
  padding:6px 10px;
}

.menu-btn{display:none;font-size:22px;cursor:pointer;}

.dark-btn{
  background:#2575fc;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

@media(max-width:768px){
  .menu-btn{display:block;}
  .nav-links{
    position:fixed;
    top:0;
    left:-100%;
    width:100%;
    height:100vh;
    background:#111;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:0.3s;
  }
  .nav-links.active{left:0;}
}

/* CONTENT */
.container{text-align:center;padding:20px;}

.search input{
  padding:10px;
  width:80%;
  max-width:400px;
  border-radius:10px;
  border:none;
}

.books{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  margin-top:20px;
}

.card{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{transform:translateY(-6px);}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card-content{padding:10px;}

.btns{display:flex;gap:8px;}

.btn{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
}

.read{background:linear-gradient(90deg,#ff4b2b,#ff7a64);}
.buy{background:linear-gradient(90deg,#0072ff,#00c6ff);}

@media(max-width:500px){
  .btns{flex-direction:column;}
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">📚 SmartFocus</div>

  <div class="menu-btn" id="menuBtn">☰</div>

  <div class="nav-links" id="navLinks">
    <a href="/">Dashboard</a>
    <a href="/todo">Todo</a>
    <a href="/timetable">Schedule</a>
    <a href="/pomodoro">Pomodoro</a>
    <a href="/notes">Notes</a>
  </div>

  <button class="dark-btn" id="darkBtn">🌙</button>
</div>

<div class="container">

<h2>📖 AI + Self Growth Books</h2>

<div class="search">
<input type="text" id="search" placeholder="Search books...">
</div>

<div class="books" id="books">

<!-- ALL BOOKS -->
<script>
const books = [
{t:"Artificial Intelligence",img:"https://rukminim2.flixcart.com/image/416/416/xif0q/book/v/r/i/artificial-intelligence-a-modern-approach-original-imahfdt5ysyayhwk.jpeg",read:"https://archive.org/details/artificial-intelligence-a-modern-approach-4th-edition",buy:"https://amazon.in"},
{t:"Deep Learning",img:"https://tse4.mm.bing.net/th/id/OIP.21z21kyGnXB5x_BfvlZZUAAAAA",read:"https://www.deeplearningbook.org/",buy:"https://amazon.in"},
{t:"Python Machine Learning",img:"https://m.media-amazon.com/images/I/71UFf8cucVL._SL1500_.jpg",read:"https://archive.org/details/python-machine-learning-3rd-edition",buy:"https://amazon.in"},
{t:"AI 2041",img:"https://tse4.mm.bing.net/th/id/OIP.ix1U2_eliBvEFdCXgalmlQHaLH",read:"https://archive.org/details/ai-2041",buy:"https://amazon.in"},
{t:"Superintelligence",img:"https://m.media-amazon.com/images/I/41eRIIe1bUL.jpg",read:"https://archive.org/details/superintelligence",buy:"https://amazon.in"},
{t:"Atomic Habits",img:"https://m.media-amazon.com/images/I/51-uspgqWIL.jpg",read:"https://jamesclear.com/atomic-habits-summary",buy:"https://amazon.in"},
{t:"7 Habits",img:"https://tse4.mm.bing.net/th/id/OIP.hJgWtlQbU_lgFZLZI_y6cAAAAA",read:"https://archive.org/details/7-habits",buy:"https://amazon.in"},
{t:"Think and Grow Rich",img:"https://tse2.mm.bing.net/th/id/OIP.o5TvS71LnHOw4oQZLvcwpQHaKe",read:"https://gutenberg.org/ebooks/60377",buy:"https://amazon.in"},
{t:"Psychology of Money",img:"https://storiesmart.com/images/book-55-big.jpg",read:"https://archive.org/details/the-psychology-of-money",buy:"https://amazon.in"},
{t:"Can't Hurt Me",img:"https://tse2.mm.bing.net/th/id/OIP.IKV555lQn11FW2kMzbybJQHaHa",read:"https://archive.org/details/cant-hurt-me",buy:"https://amazon.in"},
{t:"General Knowledge 2025",img:"https://th.bing.com/th/id/OIP.FdTisXyBu9PYXc5VlVemoQHaLh",read:"https://pdfdrive.com",buy:"https://amazon.in"}
];

const container = document.getElementById("books");

books.forEach(b=>{
container.innerHTML += `
<div class="card" data-title="${b.t.toLowerCase()}">
<img src="${b.img}">
<div class="card-content">
<h3>${b.t}</h3>
<div class="btns">
<a href="${b.read}" target="_blank" class="btn read">Read</a>
<a href="${b.buy}" target="_blank" class="btn buy">Buy</a>
</div>
</div>
</div>`;
});
</script>

</div>

</div>

<script>
/* MENU */
menuBtn.onclick=()=>navLinks.classList.toggle("active");

/* DARK MODE */
darkBtn.onclick=()=>document.body.classList.toggle("light");

/* SEARCH */
search.onkeyup=()=>{
let v=search.value.toLowerCase();
document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.dataset.title.includes(v)?"block":"none";
});
};
</script>

</body>
</html>
